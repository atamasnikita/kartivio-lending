map $uri $kartivio_content_security_policy {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.org https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.kartivio-ai.ru https://edge.kartivio-ai.ru https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.org https://yastatic.net; frame-src 'self' https://yandex.ru https://*.yandex.ru https://yoomoney.ru https://*.yoomoney.ru https://yookassa.ru https://*.yookassa.ru; upgrade-insecure-requests";
    ~^/app(?:/|$) "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; form-action 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.org https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.kartivio-ai.ru https://edge.kartivio-ai.ru https://mc.yandex.ru https://mc.yandex.com https://mc.webvisor.org https://yastatic.net; frame-src 'self' https://yandex.ru https://*.yandex.ru https://yoomoney.ru https://*.yoomoney.ru https://yookassa.ru https://*.yookassa.ru; upgrade-insecure-requests";
}

server {
    listen 80;
    listen [::]:80;
    server_name kartivio-ai.ru www.kartivio-ai.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name kartivio-ai.ru www.kartivio-ai.ru;

    root /var/www/kartivio-ai.ru/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/kartivio-ai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kartivio-ai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), xr-spatial-tracking=()" always;
    add_header Content-Security-Policy "$kartivio_content_security_policy" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /app {
        return 301 /app/;
    }

    location = /payment/return {
        return 302 /app/$is_args$args;
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /app/ {
        try_files /app/index.html =404;
        expires -1;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
        expires -1;
    }

    location ~* ^/(?:app/.*\.(?:js|css)|.*\.(?:svg|ico|png|jpg|jpeg|webp|gif|txt|xml))$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
